<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>MiniKV</title>
<style>body{font-family:monospace;max-width:600px;margin:40px auto;padding:0 20px}
h1{color:#333}input,button{margin:4px;padding:6px 10px}
#result{background:#f5f5f5;padding:10px;margin-top:10px;white-space:pre}</style>
</head>
<body>
<h1>MiniKV</h1>
<p>Authorization: Bearer <input id="apiKey" placeholder="paste api key" size="40"></p>
<div>
  <b>PUT</b> key=<input id="putKey" size="15"> value=<input id="putVal" size="20">
  <button onclick="doPut()">Put</button>
</div>
<div>
  <b>GET</b> key=<input id="getKey" size="15">
  <button onclick="doGet()">Get</button>
</div>
<div id="result"></div>
<script>
const auth = () => document.getElementById('apiKey').value;
const show = (r) => document.getElementById('result').textContent = JSON.stringify(r, null, 2);
async function doPut() {
  const k = document.getElementById('putKey').value;
  const v = document.getElementById('putVal').value;
  const r = await fetch('/put?key='+encodeURIComponent(k)+'&value='+encodeURIComponent(v),
    {method:'PUT',headers:{'Authorization':'Bearer '+auth()}});
  show(await r.json());
}
async function doGet() {
  const k = document.getElementById('getKey').value;
  const r = await fetch('/get?key='+encodeURIComponent(k),
    {headers:{'Authorization':'Bearer '+auth()}});
  show(await r.json());
}
</script>
</body>
</html>
